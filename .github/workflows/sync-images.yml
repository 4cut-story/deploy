# 서비스 이미지 태그 동기화
# 각 서비스 레포의 main ci 실행 중 이미지 잡까지 성공한 가장 최근 커밋을 찾아
# k8s/apps/<서비스>/kustomization.yaml 의 images[app].newTag 를 그 sha로 바꿔 커밋한다.
# Argo CD ApplicationSet이 이 커밋을 보고 자동 동기화한다.
#
# 서비스 CI는 이미지를 올린 직후 app·sha 입력으로 이 워크플로를 바로 실행한다(common notify-deploy 잡).
# 그 경우 해당 서비스만 그 sha로 바꾼다. 커밋은 이 레포의 기본 GITHUB_TOKEN으로 하므로
# 서비스 쪽 토큰은 이 워크플로 실행 권한(Actions 쓰기)만 있으면 된다.
# 10분 폴링은 토큰 만료·호출 실패에 대비한 백업이다.
name: sync-images

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 서비스 이름 (비우면 전체 서비스를 폴링 방식으로 확인)
        required: false
      sha:
        description: 이미지 태그로 쓸 커밋 sha (40자)
        required: false

# 서비스별로 줄을 세운다. 같은 서비스의 대기 중 실행은 더 새 실행으로 바뀌고, 다른 서비스는 서로 막지 않는다.
concurrency:
  group: sync-images-${{ inputs.app || 'all' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Update image tags
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          IN_APP: ${{ inputs.app }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          changed=()
          if [ -n "${IN_APP:-}" ]; then
            [[ "$IN_APP" =~ ^[a-z0-9-]+$ && "${IN_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::잘못된 입력 app=$IN_APP sha=$IN_SHA"; exit 1; }
            dirs=("k8s/apps/$IN_APP/")
          else
            dirs=(k8s/apps/*/)
          fi
          for dir in "${dirs[@]}"; do
            app=$(basename "$dir")
            k="$dir/kustomization.yaml"
            # images 항목에 app 이미지가 있는 서비스만 대상 (external, network-policies 제외)
            grep -q "newName: ghcr.io/$OWNER/$app" "$k" 2>/dev/null || { echo "$app: 대상 아님"; continue; }
            current=$(grep -oP 'newTag:\s*\K[^\s#]+' "$k" || true)
            if [ -n "${IN_APP:-}" ]; then
              sha=$IN_SHA
            else
            # 최근 성공한 main push 실행 중 이미지 잡이 성공한 첫 실행의 커밋
            sha=""
            for run in $(gh api "repos/$OWNER/$app/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=10" \
                           --jq '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
              id=${run%%:*}
              ok=$(gh api "repos/$OWNER/$app/actions/runs/$id/jobs" \
                     --jq '[.jobs[] | select(.name | test("(^| / )image$")) | select(.conclusion == "success")] | length')
              if [ "$ok" -gt 0 ]; then sha=${run#*:}; break; fi
            done
            fi
            if [ -z "$sha" ]; then echo "$app: 아직 이미지 없음"; continue; fi
            if [ "$sha" = "$current" ]; then echo "$app: 최신 ($sha)"; continue; fi
            # 폴링이 방금 바로 반영된 더 새 sha를 옛 sha로 되돌리지 않게, 앞선 커밋일 때만 바꾼다.
            if [ -z "${IN_APP:-}" ] && [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
              rel=$(gh api "repos/$OWNER/$app/compare/$current...$sha" --jq .status 2>/dev/null || echo unknown)
              if [ "$rel" != "ahead" ]; then echo "$app: $sha 가 현재($current)보다 새롭지 않음($rel), 건너뜀"; continue; fi
            fi
            echo "$app: $current -> $sha"
            (cd "$dir" && kustomize edit set image "app=ghcr.io/$OWNER/$app:$sha")
            # 첫 배포: bootstrap 동안 0이던 replica를 1로 올린다
            if [ "$current" = "bootstrap" ]; then (cd "$dir" && kustomize edit set replicas "$app=1"); fi
            changed+=("$app:${sha::7}")
          done
          if [ ${#changed[@]} -eq 0 ]; then echo "바뀐 이미지 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps
          git commit -m "chore: image ${changed[*]}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "::warning::push rejected, rebase and retry $i/5"
            git pull --rebase
          done
          exit 1
