# 서비스 이미지 태그 동기화
# 각 서비스 레포의 main ci 실행 중 이미지 잡까지 성공한 가장 최근 커밋을 찾아
# k8s/apps/<서비스>/kustomization.yaml 의 images[app].newTag 를 그 sha로 바꿔 커밋한다.
# Argo CD ApplicationSet이 이 커밋을 보고 자동 동기화한다.
#
# 서비스 CI가 이 레포에 직접 push하지 않는다. 그래서 레포 간 쓰기 토큰(PAT)이 필요 없고,
# 이 레포의 기본 GITHUB_TOKEN만 쓴다. 대신 반영까지 최대 10분 정도 걸린다.
# 바로 반영하려면 Actions에서 이 워크플로를 수동 실행(Run workflow)한다.
name: sync-images

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-images
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Update image tags
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          changed=()
          for dir in k8s/apps/*/; do
            app=$(basename "$dir")
            k="$dir/kustomization.yaml"
            # images 항목에 app 이미지가 있는 서비스만 대상 (external, network-policies 제외)
            grep -q "newName: ghcr.io/$OWNER/$app" "$k" 2>/dev/null || continue
            current=$(grep -oP 'newTag:\s*\K[^\s#]+' "$k" || true)
            # 최근 성공한 main push 실행 중 이미지 잡이 성공한 첫 실행의 커밋
            sha=""
            for run in $(gh api "repos/$OWNER/$app/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=10" \
                           --jq '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
              id=${run%%:*}
              ok=$(gh api "repos/$OWNER/$app/actions/runs/$id/jobs" \
                     --jq '[.jobs[] | select(.name | test("(^| / )image$")) | select(.conclusion == "success")] | length')
              if [ "$ok" -gt 0 ]; then sha=${run#*:}; break; fi
            done
            if [ -z "$sha" ]; then echo "$app: 아직 이미지 없음"; continue; fi
            if [ "$sha" = "$current" ]; then echo "$app: 최신 ($sha)"; continue; fi
            echo "$app: $current -> $sha"
            (cd "$dir" && kustomize edit set image "app=ghcr.io/$OWNER/$app:$sha")
            changed+=("$app:${sha::7}")
          done
          if [ ${#changed[@]} -eq 0 ]; then echo "바뀐 이미지 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps
          git commit -m "chore: image ${changed[*]}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "::warning::push rejected, rebase and retry $i/5"
            git pull --rebase
          done
          exit 1
