# web: 화면(SSR) + BFF, 외부 공개는 이것만
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 갱신 중에도 서빙 pod 수가 줄지 않는다
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # GHCR 패키지가 비공개일 때 필요 (README 참고)
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: app   # 실제 이미지·태그는 kustomization.yaml images에서 정한다 (CI가 갱신)
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-properties   # DB·MinIO·OAuth 등 비밀 값 (README 참고)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
