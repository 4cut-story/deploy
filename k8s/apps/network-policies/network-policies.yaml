# 호출 방향 (architecture.md 12절): ingress → web(/), ingress → api-gateway(/internal/gpu-jobs만), web → api-gateway → auth/conversation/content, conversation → content
# 들어오는 트래픽은 기본 차단하고 아래 방향만 연다. 나가는 트래픽(DB·MinIO)은 막지 않는다. GPU PC는 클러스터가 부르지 않는다(pull).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:   # Ingress 컨트롤러 (일반 설치: ingress-nginx, Rancher RKE2: kube-system)
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ingress-nginx, kube-system]
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-api-gateway
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
        - namespaceSelector:   # GPU 워커 경로(/internal/gpu-jobs)만 Ingress로 들어온다
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ingress-nginx, kube-system]
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-auth-service
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-conversation-service
spec:
  podSelector:
    matchLabels:
      app: conversation-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:   # 탈퇴 정리 DELETE /internal/users/{userId}/data
            matchLabels:
              app: auth-service
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-content-service
spec:
  podSelector:
    matchLabels:
      app: content-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: conversation-service
        - podSelector:   # 탈퇴 정리 DELETE /internal/users/{userId}/data
            matchLabels:
              app: auth-service
      ports:
        - port: 8080
