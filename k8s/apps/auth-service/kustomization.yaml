apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
# 설정이 바뀌면 이름 해시가 바뀌어 롤링 재시작된다
configMapGenerator:
- literals:
  - TZ=Asia/Seoul
  - PUBLIC_BASE_URL=https://4cut.java21.net
  - SERVICES_CONVERSATION_URL=http://conversation-service:8080
  - SERVICES_CONTENT_URL=http://content-service:8080
  name: auth-service-config
# 첫 이미지가 나오기 전(bootstrap)에는 pod를 띄우지 않는다. sync-images가 첫 sha를 넣을 때 1로 올린다.
# 이후 replica 수는 여기서 바꾼다 (deployment.yaml보다 우선).
replicas:
- count: 1
  name: auth-service
images:
- name: app
  newName: ghcr.io/4cut-story/auth-service
  newTag: de4f69a3c052e49e1f17207a77aa2324187ea19d
