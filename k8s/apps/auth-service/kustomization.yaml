apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# 설정이 바뀌면 이름 해시가 바뀌어 롤링 재시작된다
configMapGenerator:
  - name: auth-service-config
    literals:
      - TZ=Asia/Seoul
images:
  - name: app
    newName: ghcr.io/4cut-story/auth-service
    newTag: bootstrap   # sync-images 워크플로가 첫 이미지 빌드 후 커밋 sha로 바꾼다
